name: Build APK

on:
  workflow_dispatch:   # se ejecuta a mano con el botón "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PEGO_ACCESS_URL: ${{ secrets.PEGO_ACCESS_URL }}

    steps:
      - name: Verificar secreto
        run: |
          if [ -z "$PEGO_ACCESS_URL" ]; then
            echo "Falta el secreto PEGO_ACCESS_URL (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pego-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
