name: Build APK

on:
  workflow_dispatch:   # se ejecuta a mano con el botón "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAREA_ACCESS_URL: ${{ secrets.MAREA_ACCESS_URL }}
      MAREA_KEYSTORE_BASE64: ${{ secrets.MAREA_KEYSTORE_BASE64 }}
      MAREA_KEYSTORE_PASSWORD: ${{ secrets.MAREA_KEYSTORE_PASSWORD }}
      # Cada compilación tiene un número mayor que la anterior, así se instala como actualización.
      MAREA_VERSION_CODE: ${{ github.run_number }}
      MAREA_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Verificar secretos
        run: |
          if [ -z "$MAREA_ACCESS_URL" ]; then
            echo "Falta el secreto MAREA_ACCESS_URL (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -z "$MAREA_KEYSTORE_BASE64" ] || [ -z "$MAREA_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Faltan MAREA_KEYSTORE_BASE64 / MAREA_KEYSTORE_PASSWORD: se firma con una llave temporal, que NO se puede instalar encima de otra versión."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # APK release (no debug): sin modo depuración la app corre mucho más fluida.
      - name: Compilar APK
        run: |
          chmod +x gradlew
          SUFFIX=""
          if [ -n "$MAREA_KEYSTORE_BASE64" ]; then
            echo "$MAREA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/marea-release.jks"
            export MAREA_KEYSTORE_PATH="$RUNNER_TEMP/marea-release.jks"
            export MAREA_KEYSTORE_PASS="$MAREA_KEYSTORE_PASSWORD"
            export MAREA_KEY_PASS="$MAREA_KEYSTORE_PASSWORD"
            export MAREA_KEY_ALIAS=marea
          else
            SUFFIX="-llave-temporal"
          fi
          ./gradlew assembleRelease \
            -PMAREA_VERSION_CODE="$MAREA_VERSION_CODE" \
            -PMAREA_VERSION_NAME="$MAREA_VERSION_NAME"
          rm -f "$RUNNER_TEMP/marea-release.jks"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/marea-$MAREA_VERSION_NAME$SUFFIX.apk"

      - name: Mostrar la firma del APK
        run: |
          echo "Huella SHA-256 del certificado (debe ser siempre la misma con la llave fija):"
          keytool -printcert -jarfile out/*.apk | grep -E "Owner|Propietario|SHA256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: marea-apk
          path: out/*.apk
          retention-days: 14
